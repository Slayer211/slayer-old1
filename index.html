<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debt & Credit Vault</title>
  <style>
    body { background:#1a1a1a; color:#eee; font-family:Arial; }
    h1 { color:#9b59b6; text-align:center; }
    nav { text-align:center; margin:20px; }
    nav button { background:#9b59b6; color:#fff; border:none; padding:10px 20px; margin:5px; border-radius:5px; cursor:pointer; }
    .page { display:none; }
    .active { display:block; }
    .dashboard { display:flex; justify-content:center; gap:20px; margin:20px; }
    .box { background:#2c2c2c; padding:15px; border-radius:8px; width:200px; text-align:center; }
    .person { background:#2c2c2c; margin:15px auto; padding:15px; border-radius:8px; width:80%; }
    .person h3 { margin:0; color:#f1c40f; }
    .actions button { margin:5px; padding:5px 10px; border:none; border-radius:5px; cursor:pointer; }
    .add { background:#27ae60; color:#fff; }
    .subtract { background:#e74c3c; color:#fff; }
    .history { margin-top:10px; font-size:14px; color:#aaa; text-align:left; }
  </style>
</head>
<body>
  <h1>Debt & Credit Vault</h1>
  <nav>
    <button onclick="showPage('debts')">Debts</button>
    <button onclick="showPage('credits')">Credits</button>
  </nav>

  <!-- Debts Page -->
  <div id="debts" class="page active">
    <h2 style="text-align:center;">Debts (I Owe)</h2>
    <div class="dashboard">
      <div class="box"><h3>Total Debt</h3><p id="totalDebt">₹0</p></div>
      <div class="box"><h3>People</h3><p id="debtCount">0</p></div>
    </div>
    <div style="text-align:center;">
      <input type="text" id="debtName" placeholder="Person Name">
      <input type="number" id="debtAmount" placeholder="Amount">
      <button onclick="addPerson('Debt')">+ Add Debt</button>
    </div>
    <div id="debtList"></div>
  </div>

  <!-- Credits Page -->
  <div id="credits" class="page">
    <h2 style="text-align:center;">Credits (They Owe Me)</h2>
    <div class="dashboard">
      <div class="box"><h3>Total Credit</h3><p id="totalCredit">₹0</p></div>
      <div class="box"><h3>People</h3><p id="creditCount">0</p></div>
    </div>
    <div style="text-align:center;">
      <input type="text" id="creditName" placeholder="Person Name">
      <input type="number" id="creditAmount" placeholder="Amount">
      <button onclick="addPerson('Credit')">+ Add Credit</button>
    </div>
    <div id="creditList"></div>
  </div>
