<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debt & Credit Vault</title>
  <style>
    body { background:#1a1a1a; color:#eee; font-family:Arial; }
    h1 { color:#9b59b6; text-align:center; }
    nav { text-align:center; margin:20px; }
    nav button { background:#9b59b6; color:#fff; border:none; padding:10px 20px; margin:5px; border-radius:5px; cursor:pointer; }
    .page { display:none; }
    .active { display:block; }
    .dashboard { display:flex; justify-content:center; gap:20px; margin:20px; }
    .box { background:#2c2c2c; padding:15px; border-radius:8px; width:180px; text-align:center; }
    input, select { padding:8px; margin:5px; border-radius:5px; border:none; }
    button.action { background:#27ae60; }
    table { width:90%; margin:20px auto; border-collapse:collapse; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    th { background:#333; }
  </style>
</head>
<body>
  <h1>Debt & Credit Vault</h1>
  <nav>
    <button onclick="showPage('debts')">Debts</button>
    <button onclick="showPage('credits')">Credits</button>
  </nav>

  <!-- Debts Page -->
  <div id="debts" class="page active">
    <h2>Debts (I Owe)</h2>
    <div class="dashboard">
      <div class="box"><h3>Total Debt</h3><p id="totalDebt">₹0</p></div>
      <div class="box"><h3>Entries</h3><p id="debtEntries">0</p></div>
    </div>
    <div>
      <input type="text" id="debtName" placeholder="Person/Entity">
      <input type="number" id="debtAmount" placeholder="Amount">
      <input type="text" id="debtNote" placeholder="Note/Due date">
      <button onclick="addEntry('Debt')">+ Add Debt</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Amount</th><th>Note</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="debtTable"></tbody>
    </table>
  </div>

  <!-- Credits Page -->
  <div id="credits" class="page">
    <h2>Credits (They Owe Me)</h2>
    <div class="dashboard">
      <div class="box"><h3>Total Credit</h3><p id="totalCredit">₹0</p></div>
      <div class="box"><h3>Entries</h3><p id="creditEntries">0</p></div>
    </div>
    <div>
      <input type="text" id="creditName" placeholder="Person/Entity">
      <input type="number" id="creditAmount" placeholder="Amount">
      <input type="text" id="creditNote" placeholder="Note/Due date">
      <button onclick="addEntry('Credit')">+ Add Credit</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Amount</th><th>Note</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="creditTable"></tbody>
    </table>
  </div>

<script>
  let data = JSON.parse(localStorage.getItem("vaultData") || "[]");

  function showPage(page) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    render();
  }

  function addEntry(type) {
    let name = document.getElementById(type.toLowerCase()+"Name").value;
    let amount = parseFloat(document.getElementById(type.toLowerCase()+"Amount").value);
    let note = document.getElementById(type.toLowerCase()+"Note").value;
    if(!name || !amount) return alert("Enter name and amount!");
    data.push({type,name,amount,note,status:"Pending"});
    render();
  }

  function updateAmount(i, delta) {
    data[i].amount += delta;
    if(data[i].amount <= 0) data[i].status = "Settled";
    render();
  }

  function deleteEntry(i) {
    if(confirm("Delete this entry?")) {
      data.splice(i,1);
      render();
    }
  }

  function render() {
    let debtTotal=0, creditTotal=0;
    let debtRows="", creditRows="";
    let debtCount=0, creditCount=0;

    data.forEach((e,i)=>{
      if(e.type==="Debt"){ debtTotal+=e.amount; debtCount++;
        debtRows+=`<tr>
          <td>${e.name}</td><td>₹${e.amount}</td><td>${e.note}</td><td>${e.status}</td>
          <td>
            <button onclick="updateAmount(${i},-promptAmount())">Pay</button>
            <button onclick="updateAmount(${i},+promptAmount())">Borrow More</button>
            <button onclick="deleteEntry(${i})">Delete</button>
          </td></tr>`;
      }
      else { creditTotal+=e.amount; creditCount++;
        creditRows+=`<tr>
          <td>${e.name}</td><td>₹${e.amount}</td><td>${e.note}</td><td>${e.status}</td>
          <td>
            <button onclick="updateAmount(${i},-promptAmount())">Received</button>
            <button onclick="updateAmount(${i},+promptAmount())">Add More</button>
            <button onclick="deleteEntry(${i})">Delete</button>
          </td></tr>`;
      }
    });

    document.getElementById("debtTable").innerHTML=debtRows;
    document.getElementById("creditTable").innerHTML=creditRows;
    document.getElementById("totalDebt").innerText="₹"+debtTotal;
    document.getElementById("totalCredit").innerText="₹"+creditTotal;
    document.getElementById("debtEntries").innerText=debtCount;
    document.getElementById("creditEntries").innerText=creditCount;
    localStorage.setItem("vaultData", JSON.stringify(data));
  }

  function promptAmount(){
    let val = parseFloat(prompt("Enter amount:"));
    return isNaN(val)?0:val;
  }

  render();
</script>
</body>
</html>
