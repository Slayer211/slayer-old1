<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debt & Credit Vault</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:linear-gradient(135deg,#74ebd5,#ACB6E5); color:#333; }
    h1 { text-align:center; padding:20px; color:#2c3e50; }
    .dashboard { display:flex; justify-content:center; gap:20px; margin:20px; flex-wrap:wrap; }
    .box { background:#fff; padding:15px; border-radius:10px; width:200px; text-align:center; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
    .newPerson { text-align:center; margin:20px; }
    input { padding:8px; margin:5px; border-radius:5px; border:1px solid #ccc; }
    button { background:#3498db; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; margin:5px; }
    .person { background:#fff; margin:15px auto; padding:15px; border-radius:10px; width:80%; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
    .credit { border-left:6px solid #27ae60; }
    .debit { border-left:6px solid #e74c3c; }
    .actions button { margin:5px; padding:6px 12px; border:none; border-radius:5px; cursor:pointer; }
    .add { background:#27ae60; color:#fff; }
    .subtract { background:#e74c3c; color:#fff; }
    .history { margin-top:10px; font-size:14px; color:#555; text-align:left; background:#f9f9f9; padding:8px; border-radius:5px; }
    .history div:nth-child(odd){ background:#ecf0f1; padding:3px; border-radius:3px; }
    .lock { text-align:center; margin:20px; }
  </style>
</head>
<body>
  <h1>Debt & Credit Vault</h1>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="box"><h3>Total Credit</h3><p id="totalCredit">₹0</p></div>
    <div class="box"><h3>Total Debit</h3><p id="totalDebit">₹0</p></div>
    <div class="box"><h3>Net Balance</h3><p id="netBalance">₹0</p></div>
  </div>

  <!-- Add Person -->
  <div class="newPerson">
    <input type="text" id="personName" placeholder="Person Name">
    <button onclick="addPerson()">+ Add Person</button>
    <button onclick="exportVault()">Export JSON</button>
    <input type="file" id="importFile" onchange="importVault(event)">
  </div>

  <!-- Optional Lock -->
  <div class="lock">
    <input type="password" id="paraphrase" placeholder="Paraphrase">
    <button onclick="lockVault()">Lock Vault</button>
    <button onclick="unlockVault()">Unlock Vault</button>
  </div>

  <!-- Person List -->
  <div id="personList"></div>

<script>
  let people = JSON.parse(localStorage.getItem("vaultPeople") || "[]");
  let locked = false;

  function addPerson(){
    let name = document.getElementById("personName").value;
    if(!name) return alert("Enter person name!");
    people.push({name, transactions:[]});
    render();
  }

  function addTransaction(i,type,amount){
    if(!amount || amount<=0) return alert("Enter valid amount!");
    people[i].transactions.push({type,amount,date:new Date().toLocaleString()});
    render();
  }

  function render(){
    if(locked){ document.getElementById("personList").innerHTML="<p style='text-align:center;'>Vault is locked</p>"; return; }
    let creditTotal=0, debitTotal=0;
    let html="";
    people.forEach((p,i)=>{
      let balance=0;
      let historyHTML="";
      p.transactions.forEach(t=>{
        if(t.type==="Credit"){ balance+=t.amount; creditTotal+=t.amount; }
        else { balance-=t.amount; debitTotal+=t.amount; }
        historyHTML+=`<div>${t.date}: ${t.type} ₹${t.amount}</div>`;
      });
      html+=`<div class="person ${balance>=0?"credit":"debit"}">
        <h3>${p.name}</h3>
        <p><strong>Balance:</strong> ₹${balance}</p>
        <div class="actions">
          <button class="add" onclick="addTransaction(${i},'Credit',promptAmount())">Add Credit</button>
          <button class="subtract" onclick="addTransaction(${i},'Debit',promptAmount())">Add Debit</button>
        </div>
        <div class="history">${historyHTML || "No transactions yet"}</div>
      </div>`;
    });
    document.getElementById("personList").innerHTML=html;
    document.getElementById("totalCredit").innerText="₹"+creditTotal;
    document.getElementById("totalDebit").innerText="₹"+debitTotal;
    document.getElementById("netBalance").innerText="₹"+(creditTotal-debitTotal);
    localStorage.setItem("vaultPeople", JSON.stringify(people));
  }

  function promptAmount(){
    let val = parseFloat(prompt("Enter amount:"));
    return isNaN(val)?0:val;
  }

  function exportVault(){
    let blob = new Blob([JSON.stringify(people)],{type:"application/json"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href=url;
    a.download="vault.json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importVault(event){
    let file = event.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload=function(e){
      try{
        people=JSON.parse(e.target.result);
        render();
        alert("Vault imported!");
      }catch(err){ alert("Invalid JSON file."); }
    };
    reader.readAsText(file);
  }

  function lockVault(){
    let key = document.getElementById("paraphrase").value;
    if(!key) return alert("Enter paraphrase!");
    locked=true;
    localStorage.setItem("vaultLock",key);
    render();
  }

  function unlockVault(){
    let key = document.getElementById("paraphrase").value;
    let savedKey = localStorage.getItem("vaultLock");
    if(key===savedKey){ locked=false; render(); alert("Vault unlocked!"); }
    else alert("Wrong paraphrase!");
  }

  render();
</script>
</body>
</html>
