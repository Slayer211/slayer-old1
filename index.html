<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debt & Credit Vault</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#f4f6f9; color:#333; }
    h1 { text-align:center; padding:20px; color:#2c3e50; }
    .dashboard { display:flex; justify-content:center; gap:20px; margin:20px; flex-wrap:wrap; }
    .box { background:#fff; padding:15px; border-radius:10px; width:200px; text-align:center; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
    .newPerson { text-align:center; margin:20px; }
    input { padding:8px; margin:5px; border-radius:5px; border:1px solid #ccc; }
    button { background:#3498db; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; margin:5px; }
    .person { background:#fff; margin:15px auto; padding:15px; border-radius:10px; width:90%; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
    .summary { font-weight:bold; margin-bottom:10px; }
    .transactions { margin:10px 0; }
    .transactions div { background:#ecf0f1; margin:3px; padding:5px; border-radius:5px; }
    .actions button { margin:3px; padding:6px 12px; border:none; border-radius:5px; cursor:pointer; }
    .add { background:#27ae60; }
    .subtract { background:#e74c3c; }
    .paid { background:#f39c12; }
    .delete { background:#c0392b; }
  </style>
</head>
<body>
  <h1>Debt & Credit Vault</h1>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="box"><h3>Total Credit</h3><p id="totalCredit">₹0</p></div>
    <div class="box"><h3>Total Debit</h3><p id="totalDebit">₹0</p></div>
    <div class="box"><h3>Net Balance</h3><p id="netBalance">₹0</p></div>
  </div>

  <!-- Add Person -->
  <div class="newPerson">
    <input type="text" id="personName" placeholder="Person Name">
    <button onclick="addPerson()">+ Add Person</button>
  </div>

  <!-- Person List -->
  <div id="personList"></div>

<script>
  let people = JSON.parse(localStorage.getItem("vaultPeople") || "[]");

  function addPerson(){
    let name = document.getElementById("personName").value;
    if(!name) return alert("Enter person name!");
    people.push({name, transactions:[], status:"Active"});
    render();
  }

  function addTransaction(i,type,amount){
    if(!amount || amount<=0) return alert("Enter valid amount!");
    people[i].transactions.push({type,amount,date:new Date().toLocaleString()});
    render();
  }

  function markPaid(i){
    people[i].status="Paid";
    people[i].transactions.push({type:"Settlement",amount:0,date:new Date().toLocaleString()});
    render();
  }

  function deletePerson(i){
    if(confirm("Delete this person?")){
      people.splice(i,1);
      render();
    }
  }

  function render(){
    let creditTotal=0, debitTotal=0;
    let html="";
    people.forEach((p,i)=>{
      let balance=0;
      let txHTML="";
      p.transactions.forEach(t=>{
        if(t.type==="Credit"){ balance+=t.amount; creditTotal+=t.amount; }
        else if(t.type==="Debit"){ balance-=t.amount; debitTotal+=t.amount; }
        txHTML+=`<div>${t.type} ₹${t.amount} (${t.date})</div>`;
      });
      let summary=`${p.transactions.length} active · ₹${balance} balance`;
      html+=`<div class="person">
        <h3>${p.name}</h3>
        <div class="summary">${summary} — Status: ${p.status}</div>
        <div class="transactions">${txHTML || "No transactions yet"}</div>
        <div class="actions">
          <button class="add" onclick="addTransaction(${i},'Credit',promptAmount())">Add Credit</button>
          <button class="subtract" onclick="addTransaction(${i},'Debit',promptAmount())">Add Debit</button>
          <button class="paid" onclick="markPaid(${i})">Mark Paid</button>
          <button class="delete" onclick="deletePerson(${i})">Delete</button>
        </div>
      </div>`;
    });
    document.getElementById("personList").innerHTML=html;
    document.getElementById("totalCredit").innerText="₹"+creditTotal;
    document.getElementById("totalDebit").innerText="₹"+debitTotal;
    document.getElementById("netBalance").innerText="₹"+(creditTotal-debitTotal);
    localStorage.setItem("vaultPeople", JSON.stringify(people));
  }

  function promptAmount(){
    let val = parseFloat(prompt("Enter amount:"));
    return isNaN(val)?0:val;
  }

  render();
</script>
</body>
</html>
